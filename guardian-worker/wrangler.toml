name = "sene-guardian-api"
main = "src/index.ts"
compatibility_date = "2026-11-26"

[[kv_namespaces]]
binding = "GUARDIAN_DATA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Bind this to the SAME existing D1 database used by SERVER-SENE.
# Obtain its database_id from the SENE VENTAS Worker configuration; do not create a new DB.
[[d1_databases]]
binding = "SENE_LICENSE_DB"
database_name = "REPLACE_WITH_EXISTING_SENE_LICENSE_DB_NAME"
database_id = "REPLACE_WITH_EXISTING_SENE_LICENSE_DB_ID"
