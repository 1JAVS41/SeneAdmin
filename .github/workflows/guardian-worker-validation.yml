name: SENE GUARDIAN code validation

on:
  push:
    branches:
      - feature/guardian-damaged-products-readonly
    paths:
      - "guardian-worker/**"
      - ".github/workflows/guardian-worker-validation.yml"
  pull_request:
    branches:
      - feature/guardian-damaged-products-readonly
    paths:
      - "guardian-worker/**"
      - ".github/workflows/guardian-worker-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Tests and TypeScript checks (no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: TypeScript type check
        run: npm run typecheck
