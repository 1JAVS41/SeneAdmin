name: Compilar APK SENE ADMIN (pruebas)
# Recompilar tras auditoría de cursor incremental y decisiones ACK.
# Recompilar tras la confirmación durable de decisiones del patrón.
# Auditoría final: recepción incremental, asistencia, inventario y ACK durable de decisiones.
on:
  push:
    branches: [main, work/sene-admin-foundation, work/payroll-dashboard-v2, fix/no-nested-inventario-sene-payroll, fix/payroll-zero-net-modern-ui, fix/payroll-attendance-sync-2026-11, feature/loan-consumption-approval-client, review/seneadmin-traffic-ack-20261123]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar firma permanente (si está configurada)
        env:
          SENE_KEYSTORE_BASE64: ${{ secrets.SENE_KEYSTORE_BASE64 }}
          SENE_STORE_PASSWORD: ${{ secrets.SENE_STORE_PASSWORD }}
          SENE_KEY_ALIAS: ${{ secrets.SENE_KEY_ALIAS }}
          SENE_KEY_PASSWORD: ${{ secrets.SENE_KEY_PASSWORD }}
        run: |
          if [ -n "$SENE_KEYSTORE_BASE64" ] && [ -n "$SENE_STORE_PASSWORD" ] && [ -n "$SENE_KEY_ALIAS" ] && [ -n "$SENE_KEY_PASSWORD" ]; then
            echo "$SENE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sene-admin-signing.jks"
            test -s "$RUNNER_TEMP/sene-admin-signing.jks"
            chmod 600 "$RUNNER_TEMP/sene-admin-signing.jks"
            echo "SENE_KEYSTORE_PATH=$RUNNER_TEMP/sene-admin-signing.jks" >> "$GITHUB_ENV"
            echo "SENE_STORE_PASSWORD=$SENE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SENE_KEY_ALIAS=$SENE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SENE_KEY_PASSWORD=$SENE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SENE_STABLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Firma permanente configurada."
          else
            echo "SENE_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::No hay firma permanente. La APK resultante es SOLO de compilación y NO debe instalarse."
          fi
      - name: Instalar Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SENE-ADMIN.apk
          test -s dist/SENE-ADMIN.apk
          unzip -t dist/SENE-ADMIN.apk >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          if [ "$SENE_STABLE_SIGNING" = "true" ]; then
            "$BUILD_TOOLS/apksigner" sign --ks "$SENE_KEYSTORE_PATH" --ks-key-alias "$SENE_KEY_ALIAS" --ks-pass env:SENE_STORE_PASSWORD --key-pass env:SENE_KEY_PASSWORD --out dist/SENE-ADMIN-signed.apk dist/SENE-ADMIN.apk
            mv dist/SENE-ADMIN-signed.apk dist/SENE-ADMIN.apk
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/SENE-ADMIN.apk
          if [ "$SENE_STABLE_SIGNING" = "true" ]; then
            echo "APK firmada con la llave permanente configurada."
          else
            echo "::warning::APK con firma temporal de depuración; NO instalar ni distribuir."
          fi
          sha256sum dist/SENE-ADMIN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SENE-ADMIN
          path: dist/SENE-ADMIN.apk
          if-no-files-found: error
