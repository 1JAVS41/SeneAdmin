name: SENE GUARDIÁN - Preparar MUSE exclusivo del propietario

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sene-guardian-owner-muse-provision-test
  cancel-in-progress: false

jobs:
  provision-owner-muse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código de pruebas
        uses: actions/checkout@v4
        with:
          ref: feature/sene-guardian-muse-readonly

      - name: Validar configuración
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_PASSWORD: ${{ secrets.MUSE_SETUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$BUNDLE_PASSWORD" && test "${#BUNDLE_PASSWORD}" -ge 20 || { echo "::error::Configura MUSE_SETUP_PASSPHRASE con al menos 20 caracteres."; exit 1; }

      - name: Preparar configuración aislada del Worker de prueba
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          LIST="$(curl --fail --silent --show-error "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          KV_ID="$(printf '%s' "$LIST" | jq -r '.result[] | select(.title == "SENE_GUARDIAN_TEST_DATA") | .id' | head -n 1)"
          test -n "$KV_ID" && test "$KV_ID" != "null"
          sed -e 's/name = "sene-guardian-api"/name = "sene-guardian-test"/' \
              -e "s/id = \"REPLACE_WITH_KV_NAMESPACE_ID\"/id = \"$KV_ID\"/" \
              guardian-worker/wrangler.toml > guardian-worker/wrangler.test.toml
          grep -q 'name = "sene-guardian-test"' guardian-worker/wrangler.test.toml
          ! grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' guardian-worker/wrangler.test.toml

      - name: Generar credencial privada y desplegar solo pruebas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_PASSWORD: ${{ secrets.MUSE_SETUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          BASE_URL="https://sene-guardian-test.nagavs28.workers.dev"
          OWNER_TOKEN="$(openssl rand -hex 32)"
          OWNER_HASH="$(printf '%s' "$OWNER_TOKEN" | sha256sum | cut -d' ' -f1)"
          umask 077
          mkdir -p secure-output
          printf '%s' "$OWNER_HASH" | npx --yes wrangler@4 secret put GUARDIAN_OWNER_CENTRAL_TOKEN_HASH --config guardian-worker/wrangler.test.toml >/dev/null 2>&1
          npx --yes wrangler@4 deploy --config guardian-worker/wrangler.test.toml >/dev/null 2>&1
          for attempt in $(seq 1 15); do
            if curl --fail --silent "$BASE_URL/v1/health" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent "$BASE_URL/v1/health" >/dev/null
          jq -n --arg mcpUrl "$BASE_URL/v1/muse/owner/mcp" \
                --arg ownerMuseReadToken "$OWNER_TOKEN" \
                --arg ownerWhatsapp "3325142147" \
                '{mcpUrl:$mcpUrl,authentication:"Bearer",ownerMuseReadToken:$ownerMuseReadToken,ownerWhatsapp:$ownerWhatsapp,environment:"test-only",access:"owner-license-requests-read-only"}' \
                > secure-output/owner-muse-connection.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 -pass env:BUNDLE_PASSWORD \
            -in secure-output/owner-muse-connection.json -out secure-output/owner-muse-connection.json.enc
          rm -f secure-output/owner-muse-connection.json
          unset OWNER_TOKEN OWNER_HASH BUNDLE_PASSWORD
          echo "Credencial privada del MUSE propietario configurada en el Worker de pruebas. El paquete se publica cifrado; ningún token se imprime."

      - name: Publicar paquete cifrado por tiempo limitado
        uses: actions/upload-artifact@v4
        with:
          name: sene-owner-muse-connection-encrypted
          path: secure-output/owner-muse-connection.json.enc
          if-no-files-found: error
          retention-days: 1
