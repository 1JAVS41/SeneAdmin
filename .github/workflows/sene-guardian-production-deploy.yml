name: SENE GUARDIÁN - Despliegue de producción

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe SI para autorizar el despliegue en producción"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sene-guardian-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'SI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sene-guardian-muse-readonly

      - name: Validar secretos requeridos
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_PASSWORD: ${{ secrets.MUSE_SETUP_PASSPHRASE }}
          DELIVERY_ENC: ${{ secrets.GUARDIAN_DELIVERY_ENC_KEY }}
          DELIVERY_HMAC: ${{ secrets.GUARDIAN_DELIVERY_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          test -n "$BUNDLE_PASSWORD" && test "${#BUNDLE_PASSWORD}" -ge 20
          test -n "$DELIVERY_ENC" && test -n "$DELIVERY_HMAC"
          echo "Credenciales de Cloudflare, entrega cifrada y paquete protegido presentes."

      - name: Instalar y verificar
        working-directory: guardian-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Preparar namespace KV de producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          LIST="$(curl --fail --silent --show-error "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          KV_ID="$(printf '%s' "$LIST" | jq -r '.result[]? | select(.title == "SENE_GUARDIAN_DATA") | .id' | head -n 1)"
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            CREATED="$(curl --fail --silent --show-error -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"title":"SENE_GUARDIAN_DATA"}')"
            KV_ID="$(printf '%s' "$CREATED" | jq -r '.result.id // empty')"
          fi
          test -n "$KV_ID" && test "$KV_ID" != "null"
          sed "s/id = \"REPLACE_WITH_KV_NAMESPACE_ID\"/id = \"$KV_ID\"/" guardian-worker/wrangler.toml > guardian-worker/wrangler.production.toml
          ! grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' guardian-worker/wrangler.production.toml

      - name: Configurar secretos y desplegar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DELIVERY_ENC: ${{ secrets.GUARDIAN_DELIVERY_ENC_KEY }}
          DELIVERY_HMAC: ${{ secrets.GUARDIAN_DELIVERY_HMAC_KEY }}
          BUNDLE_PASSWORD: ${{ secrets.MUSE_SETUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          OWNER_TOKEN="$(openssl rand -hex 32)"
          OWNER_HASH="$(printf '%s' "$OWNER_TOKEN" | sha256sum | cut -d' ' -f1)"
          ADMIN_TOKEN="$(openssl rand -hex 32)"
          CONFIG="guardian-worker/wrangler.production.toml"
          umask 077
          mkdir -p secure-output
          printf '%s' "$OWNER_HASH" | npx --yes wrangler@4 secret put GUARDIAN_OWNER_CENTRAL_TOKEN_HASH --config "$CONFIG" >/dev/null 2>&1
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put GUARDIAN_ADMIN_TOKEN --config "$CONFIG" >/dev/null 2>&1
          printf '%s' "$DELIVERY_ENC" | npx --yes wrangler@4 secret put GUARDIAN_DELIVERY_ENC_KEY --config "$CONFIG" >/dev/null 2>&1
          printf '%s' "$DELIVERY_HMAC" | npx --yes wrangler@4 secret put GUARDIAN_DELIVERY_HMAC_KEY --config "$CONFIG" >/dev/null 2>&1
          npx --yes wrangler@4 deploy --config "$CONFIG"
          jq -n --arg url "https://sene-guardian-api.nagavs28.workers.dev/v1/muse/owner/mcp" --arg token "$OWNER_TOKEN" --arg admin "$ADMIN_TOKEN" --arg passphrase "$BUNDLE_PASSWORD" '{mcpUrl:$url,authentication:"Bearer",ownerMuseReadToken:$token,adminToken:$admin,ownerWhatsapp:"3325142147",environment:"production",access:"owner-license-requests-read-only",packagePassphrase:$passphrase}' > secure-output/owner-muse-production.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 -pass env:BUNDLE_PASSWORD -in secure-output/owner-muse-production.json -out secure-output/owner-muse-production.json.enc
          rm -f secure-output/owner-muse-production.json
          unset OWNER_TOKEN OWNER_HASH ADMIN_TOKEN BUNDLE_PASSWORD DELIVERY_ENC DELIVERY_HMAC

      - name: Entregar paquete cifrado al propietario
        uses: actions/upload-artifact@v4
        with:
          name: sene-owner-muse-production-encrypted
          path: secure-output/owner-muse-production.json.enc
          if-no-files-found: error
          retention-days: 1
