name: SENE GUARDIAN - Crear conexión MUSE de prueba

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sene-guardian-muse-provision-test
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sene-guardian-muse-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar secretos necesarios
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_PASSWORD: ${{ secrets.MUSE_SETUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$BUNDLE_PASSWORD" && test "${#BUNDLE_PASSWORD}" -ge 20 || { echo "::error::Configura MUSE_SETUP_PASSPHRASE con al menos 20 caracteres."; exit 1; }

      - name: Preparar configuración aislada del Worker de prueba
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          LIST="$(curl --fail --silent --show-error "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          KV_ID="$(printf '%s' "$LIST" | jq -r '.result[] | select(.title == "SENE_GUARDIAN_TEST_DATA") | .id' | head -n 1)"
          test -n "$KV_ID" && test "$KV_ID" != "null"
          sed -e 's/name = "sene-guardian-api"/name = "sene-guardian-test"/' \
              -e "s/id = \"REPLACE_WITH_KV_NAMESPACE_ID\"/id = \"$KV_ID\"/" \
              guardian-worker/wrangler.toml > guardian-worker/wrangler.test.toml
          grep -q 'name = "sene-guardian-test"' guardian-worker/wrangler.test.toml
          ! grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' guardian-worker/wrangler.test.toml

      - name: Crear credenciales exclusivas y aprovisionar instalación
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_PASSWORD: ${{ secrets.MUSE_SETUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          BASE_URL="https://sene-guardian-test.nagavs28.workers.dev"
          ADMIN_TOKEN="$(openssl rand -hex 32)"
          INSTALLATION_ID="$(cat /proc/sys/kernel/random/uuid)"
          umask 077
          mkdir -p secure-output

          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put GUARDIAN_ADMIN_TOKEN --config guardian-worker/wrangler.test.toml >/dev/null 2>&1
          npx --yes wrangler@4 deploy --config guardian-worker/wrangler.test.toml >/dev/null 2>&1
          for attempt in $(seq 1 15); do
            if curl --fail --silent "$BASE_URL/v1/health" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent "$BASE_URL/v1/health" >/dev/null

          HTTP_CODE="$(curl --silent --show-error -o /tmp/sene-muse-provision.json -w '%{http_code}' \
            -X POST "$BASE_URL/v1/admin/installations" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg id "$INSTALLATION_ID" '{installationId:$id}')")"
          test "$HTTP_CODE" = "201" || { echo "::error::No se pudo crear la instalación (HTTP $HTTP_CODE)."; exit 1; }

          INGEST_TOKEN="$(jq -er '.ingestToken' /tmp/sene-muse-provision.json)"
          MUSE_TOKEN="$(jq -er '.museReadToken' /tmp/sene-muse-provision.json)"
          jq -n --arg installationId "$INSTALLATION_ID" \
                --arg mcpUrl "$BASE_URL/v1/muse/$INSTALLATION_ID/mcp" \
                --arg museReadToken "$MUSE_TOKEN" \
                --arg ingestToken "$INGEST_TOKEN" \
                --arg adminToken "$ADMIN_TOKEN" \
                '{installationId:$installationId,mcpUrl:$mcpUrl,authentication:"Bearer",museReadToken:$museReadToken,ingestToken:$ingestToken,adminToken:$adminToken,environment:"test-only"}' \
                > secure-output/muse-connection.json

          printf '%s' "$ADMIN_TOKEN" | sha256sum | cut -d' ' -f1 >/dev/null
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 \
            -pass env:BUNDLE_PASSWORD \
            -in secure-output/muse-connection.json \
            -out secure-output/muse-connection.json.enc
          rm -f secure-output/muse-connection.json /tmp/sene-muse-provision.json
          unset ADMIN_TOKEN INGEST_TOKEN MUSE_TOKEN BUNDLE_PASSWORD
          echo "Instalación de prueba creada. El paquete de credenciales se publica cifrado y no se imprime ningún token."

      - name: Publicar paquete cifrado por tiempo limitado
        uses: actions/upload-artifact@v4
        with:
          name: sene-muse-connection-encrypted
          path: secure-output/muse-connection.json.enc
          if-no-files-found: error
          retention-days: 1
