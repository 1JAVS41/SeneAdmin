name: SENE GUARDIAN Free Test Deploy

on:
  push:
    branches:
      - feature/sene-guardian-muse-readonly
    paths:
      - "guardian-worker/**"
      - ".github/workflows/sene-guardian-free-test-deploy.yml"

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm required secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Create or reuse isolated free-tier KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          LIST="$(curl --fail --silent --show-error "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          KV_ID="$(printf '%s' "$LIST" | jq -r '.result[] | select(.title == "SENE_GUARDIAN_TEST_DATA") | .id' | head -n 1)"
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            CREATED="$(curl --fail --silent --show-error -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"title":"SENE_GUARDIAN_TEST_DATA"}')"
            KV_ID="$(printf '%s' "$CREATED" | jq -r '.result.id')"
          fi
          test -n "$KV_ID" && test "$KV_ID" != "null"
          echo "namespace_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "KV namespace ready: SENE_GUARDIAN_TEST_DATA"
      - name: Prepare isolated test Worker config
        env:
          KV_ID: ${{ steps.kv.outputs.namespace_id }}
        run: |
          set -euo pipefail
          sed -e 's/name = "sene-guardian-api"/name = "sene-guardian-test"/' \
              -e "s/id = \"REPLACE_WITH_KV_NAMESPACE_ID\"/id = \"$KV_ID\"/" \
              guardian-worker/wrangler.toml > guardian-worker/wrangler.test.toml
          grep -q 'name = "sene-guardian-test"' guardian-worker/wrangler.test.toml
          ! grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' guardian-worker/wrangler.test.toml
      - name: Deploy test Worker on Cloudflare Free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config guardian-worker/wrangler.test.toml
      - name: End-to-end test with ephemeral fictional installation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: guardian-worker
        run: |
          set -euo pipefail
          set +x
          BASE_URL="https://sene-guardian-test.nagavs28.workers.dev"
          HEALTH="$(curl --fail --silent --show-error "$BASE_URL/v1/health")"
          printf '%s' "$HEALTH" | jq -e '.service == "SENE GUARDIAN" and .status == "online" and .api == 1' >/dev/null

          # Create a throwaway admin credential in this runner only.
          ADMIN_TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put GUARDIAN_ADMIN_TOKEN --config wrangler.test.toml >/dev/null

          INSTALLATION_ID="$(cat /proc/sys/kernel/random/uuid)"
          printf '%s' "$INSTALLATION_ID" > /tmp/sene-test-installation-id
          curl --fail --silent --show-error -X POST "$BASE_URL/v1/admin/installations" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg id "$INSTALLATION_ID" '{installationId:$id}')" \
            > /tmp/sene-installation.json
          INGEST_TOKEN="$(jq -er '.ingestToken' /tmp/sene-installation.json)"
          MUSE_TOKEN="$(jq -er '.museReadToken' /tmp/sene-installation.json)"

          CAPTURED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -nc --arg id "$INSTALLATION_ID" --arg captured "$CAPTURED_AT" \
            '{schema:1,installationId:$id,capturedAt:$captured,business:{status:"active"},inventory:{categories:[{category:"INVENTARIO_MAESTRO",itemCount:7,unitsInStock:24,lowStockCount:2,outOfStockCount:1,updatedAt:$captured}]}}' \
            > /tmp/sene-fictional-snapshot.json
          curl --fail --silent --show-error -X POST "$BASE_URL/v1/snapshot" \
            -H "Authorization: Bearer $INGEST_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/sene-fictional-snapshot.json > /tmp/sene-snapshot-result.json
          jq -e '.accepted == true' /tmp/sene-snapshot-result.json >/dev/null

          MCP_URL="$BASE_URL/v1/muse/$INSTALLATION_ID/mcp"
          curl --fail --silent --show-error -D /tmp/sene-mcp-headers -o /tmp/sene-mcp-init.json \
            -X POST "$MCP_URL" -H "Authorization: Bearer $MUSE_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"SENE test runner","version":"1.0"}}}'
          jq -e '.result.protocolVersion == "2025-03-26"' /tmp/sene-mcp-init.json >/dev/null
          grep -qi '^mcp-protocol-version: 2025-03-26' /tmp/sene-mcp-headers

          curl --fail --silent --show-error -o /tmp/sene-mcp-notify.txt -w '%{http_code}' \
            -X POST "$MCP_URL" -H "Authorization: Bearer $MUSE_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' > /tmp/sene-notify-status
          test "$(cat /tmp/sene-notify-status)" = "202"

          curl --fail --silent --show-error -o /tmp/sene-mcp-tools.json \
            -X POST "$MCP_URL" -H "Authorization: Bearer $MUSE_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          jq -e '.result.tools | length == 1 and .[0].name == "get_business_overview" and .[0].annotations.readOnlyHint == true' /tmp/sene-mcp-tools.json >/dev/null

          curl --fail --silent --show-error -o /tmp/sene-mcp-call.json \
            -X POST "$MCP_URL" -H "Authorization: Bearer $MUSE_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_business_overview","arguments":{}}}'
          jq -e '.result.structuredContent.business.status == "active" and .result.structuredContent.inventory.categories[0].itemCount == 7 and (.result.structuredContent | has("installationId") | not)' /tmp/sene-mcp-call.json >/dev/null

          # Revoke the disposable installation and rotate the admin credential.
          curl --fail --silent --show-error -X POST "$BASE_URL/v1/admin/installations/revoke" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg id "$INSTALLATION_ID" '{installationId:$id}')" \
            > /tmp/sene-revoke.json
          jq -e '.revoked == true' /tmp/sene-revoke.json >/dev/null
          ROTATED_ADMIN_TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$ROTATED_ADMIN_TOKEN" | npx --yes wrangler@4 secret put GUARDIAN_ADMIN_TOKEN --config wrangler.test.toml >/dev/null

          rm -f /tmp/sene-installation.json /tmp/sene-fictional-snapshot.json /tmp/sene-mcp-*.json /tmp/sene-mcp-headers /tmp/sene-mcp-notify.txt /tmp/sene-notify-status /tmp/sene-snapshot-result.json /tmp/sene-revoke.json /tmp/sene-test-installation-id
          unset ADMIN_TOKEN INGEST_TOKEN MUSE_TOKEN ROTATED_ADMIN_TOKEN
          echo "PASS: fictional installation provisioned, fake snapshot ingested, MCP initialized, read-only tool listed and called, and installation revoked."
