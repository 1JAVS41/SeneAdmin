name: SENE GUARDIAN Worker checks

on:
  push:
    branches: [feature/sene-guardian-muse-readonly, feature/muse-license-gate]
    paths:
      - "guardian-worker/**"
      - ".github/workflows/guardian-worker-checks.yml"
  pull_request:
    branches: [feature/sene-guardian-muse-readonly]
    paths:
      - "guardian-worker/**"
      - ".github/workflows/guardian-worker-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Security tests
        run: npm test
