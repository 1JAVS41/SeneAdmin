name: Build SeneAdmin APK

on:
  push:
    branches:
      - feature/seneadmin-animated-thanks-20261125
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seneadmin-animated-thanks-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare permanent signing
        env:
          SENE_KEYSTORE_BASE64: ${{ secrets.SENE_KEYSTORE_BASE64 }}
          SENE_STORE_PASSWORD: ${{ secrets.SENE_STORE_PASSWORD }}
          SENE_KEY_ALIAS: ${{ secrets.SENE_KEY_ALIAS }}
          SENE_KEY_PASSWORD: ${{ secrets.SENE_KEY_PASSWORD }}
        run: |
          if [ -z "$SENE_KEYSTORE_BASE64" ] || [ -z "$SENE_STORE_PASSWORD" ] || [ -z "$SENE_KEY_ALIAS" ] || [ -z "$SENE_KEY_PASSWORD" ]; then
            echo "::error::Permanent signing secrets are not configured. Refusing to produce a distributable APK."
            exit 1
          fi
          echo "$SENE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sene-admin-signing.jks"
          test -s "$RUNNER_TEMP/sene-admin-signing.jks"
          chmod 600 "$RUNNER_TEMP/sene-admin-signing.jks"
          echo "SENE_KEYSTORE_PATH=$RUNNER_TEMP/sene-admin-signing.jks" >> "$GITHUB_ENV"
          echo "SENE_STORE_PASSWORD=$SENE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SENE_KEY_ALIAS=$SENE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SENE_KEY_PASSWORD=$SENE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile SeneAdmin
        run: gradle --no-daemon :app:assembleDebug

      - name: Sign and verify APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SENE-ADMIN.apk
          test -s dist/SENE-ADMIN.apk
          unzip -t dist/SENE-ADMIN.apk >/dev/null
          "$APKSIGNER" sign --ks "$SENE_KEYSTORE_PATH" --ks-key-alias "$SENE_KEY_ALIAS" --ks-pass env:SENE_STORE_PASSWORD --key-pass env:SENE_KEY_PASSWORD --out dist/SENE-ADMIN-signed.apk dist/SENE-ADMIN.apk
          mv dist/SENE-ADMIN-signed.apk dist/SENE-ADMIN.apk
          "$APKSIGNER" verify --verbose --print-certs dist/SENE-ADMIN.apk
          sha256sum dist/SENE-ADMIN.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SENE-ADMIN-ANIMATED-THANKS
          path: dist/SENE-ADMIN.apk
          if-no-files-found: error
          retention-days: 30
